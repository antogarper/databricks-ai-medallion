source_name: open_meteo_forecast
source_type: http_api
description: 'Open-Meteo hourly weather forecast API: temperature, humidity, precipitation,
  cloud cover, wind speed at 10 m and 100 m, and solar radiation for the capitals
  of the 52 Spanish provinces, in UTC.'
auth:
  type: none
incremental:
  type: date_range
  days_back: 1
  chunk_days: 7
  date_format: '%Y-%m-%d'
  end_offset_days: 2
endpoints:
- name: hourly_weather
  url: https://api.open-meteo.com/v1/forecast
  method: GET
  response_format: json
  params:
    start_date: '{start}'
    end_date: '{end}'
    hourly: temperature_2m,relative_humidity_2m,precipitation,cloud_cover,wind_speed_10m,wind_speed_100m,shortwave_radiation
    timezone: GMT
  locations:
    reference: locations_es.csv
    key_column: province_code
    latitude_param: latitude
    longitude_param: longitude
