source_name: open_meteo_forecast
source_type: http_api
description: "Open-Meteo hourly weather forecast API: temperature, humidity, precipitation, cloud cover, wind speed at 10 m and 100 m, and solar radiation for the capitals of the 52 Spanish provinces, in UTC."
provider: "Open-Meteo"
license: "CC BY 4.0 (attribution required)"

auth:
  type: none

load:
  strategy: incremental
  unit: day
  initial_window: 1          # only the latest forecast is relevant
  refresh_window: 1
  chunk_size: 7              # days per API call (Monday-Sunday weeks)
  end_offset: 2              # today + 2 days of forecast
  date_format: "%Y-%m-%d"

limits:
  quota_group: open_meteo
  per_minute: 600
  per_hour: 5000
  per_day: 10000
  min_seconds_between_calls: 1
  cost:
    per_location: true
    days_per_unit: 14
    variables_param: hourly
    variables_per_unit: 10
  terms_url: https://open-meteo.com/en/terms

endpoints:
  - name: hourly_weather
    url: https://api.open-meteo.com/v1/forecast
    method: GET
    response_format: json
    params:
      start_date: "{start}"
      end_date: "{end}"
      hourly: temperature_2m,relative_humidity_2m,precipitation,cloud_cover,wind_speed_10m,wind_speed_100m,shortwave_radiation
      timezone: GMT
    locations:
      reference: locations_es.csv
      key_column: province_code
      latitude_param: latitude
      longitude_param: longitude