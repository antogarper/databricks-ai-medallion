source_name: open_meteo_archive
source_type: http_api
description: "Open-Meteo historical weather API (observed/reanalysis): hourly temperature, humidity, precipitation, cloud cover, wind speed at 10 m and 100 m and solar radiation for the capitals of the 52 Spanish provinces, in UTC."

auth:
  type: none

load:
  strategy: incremental
  unit: day
  initial_window: 90         # days loaded on the first run
  refresh_window: 10         # 5-day publication delay + recent revisions
  chunk_size: 7              # days per API call (Monday-Sunday weeks)
  end_offset: -5             # the archive API publishes data with a ~5 day delay
  date_format: "%Y-%m-%d"

endpoints:
  - name: hourly_weather
    url: https://archive-api.open-meteo.com/v1/archive
    method: GET
    response_format: json
    params:
      start_date: "{start}"
      end_date: "{end}"
      hourly: temperature_2m,relative_humidity_2m,precipitation,cloud_cover,wind_speed_10m,wind_speed_100m,shortwave_radiation
      timezone: GMT
    locations:
      reference: locations_es.csv
      key_column: province_code
      latitude_param: latitude
      longitude_param: longitude