source_name: public_holidays_es
source_type: http_api
description: "Nager.Date public holidays API: national and regional public holidays in Spain, one call per year (previous years, current year and next year)."
provider: "Nager.Date"
license: "Free / Community API"

auth:
  type: none

load:
  strategy: incremental
  unit: year
  history_start: "2023-01-01"   # history kept since 2023
  refresh_window: 1             # every run: previous year, current year...
  chunk_size: 1                 # one year per call
  end_offset: 1                 # ...and next year (published in advance)
  date_format: "%Y"

endpoints:
  - name: holidays
    url: https://date.nager.at/api/v3/PublicHolidays/{start}/ES
    method: GET
    response_format: json