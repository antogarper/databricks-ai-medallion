source_name: open_meteo
source_type: http_api
description: "Open-Meteo historical weather API: hourly temperature, wind speed and solar radiation for Madrid, Seville and Zaragoza."

auth:
  type: none

incremental:
  type: date_range
  days_back: 90
  chunk_days: 31
  date_format: "%Y-%m-%d"
  end_offset_days: -5        # the archive API publishes data with a ~5 day delay

endpoints:
  - name: hourly_weather
    url: https://archive-api.open-meteo.com/v1/archive
    method: GET
    response_format: json
    params:
      latitude: "40.4168,37.3891,41.6488"
      longitude: "-3.7038,-5.9845,-0.8891"
      start_date: "{start}"
      end_date: "{end}"
      hourly: temperature_2m,wind_speed_10m,shortwave_radiation
      timezone: Europe/Madrid