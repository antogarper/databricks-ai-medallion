source_name: ree
source_type: http_api
description: "Red Electrica de Espana public API: hourly market prices (PVPC, spot) and daily generation mix."
provider: "Red Eléctrica de España (REE)"
license: "REE terms of use: reuse allowed citing the source"

auth:
  type: none

load:
  strategy: incremental
  unit: day
  history_start: "2025-01-01"   # history kept since this date
  refresh_window: 7             # daily run: last 7 days (late corrections)
  reconcile_window: 60          # weekly reconciliation: last 60 days
  chunk_size: 7                 # days per API call (Monday-Sunday weeks)
  end_offset: 0                 # up to today
  date_format: "%Y-%m-%d"

endpoints:
  - name: prices
    url: https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real
    method: GET
    response_format: json
    params:
      start_date: "{start}T00:00"
      end_date: "{end}T23:59"
      time_trunc: hour

  - name: generation
    url: https://apidatos.ree.es/es/datos/generacion/estructura-generacion
    method: GET
    response_format: json
    params:
      start_date: "{start}T00:00"
      end_date: "{end}T23:59"
      time_trunc: day