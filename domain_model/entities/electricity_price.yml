entity: electricity_price
description: "Electricity price in Spain by price type, at the resolution published by the source (hourly or quarter-hourly), in EUR/MWh and UTC."
domain: energy_market
table_type: entity
grain: "one row per price type and period start (UTC)"
business_keys: [price_type, datetime_utc]
columns:
  - name: price_type
    type: string
    nullable: false
    accepted_values: [pvpc, day_ahead_spot]
    description: "Canonical price type: pvpc (regulated consumer price) or day_ahead_spot (day-ahead market price)"
  - name: datetime_utc
    type: timestamp
    nullable: false
    description: "Start of the period, UTC"
  - name: resolution_minutes
    type: int
    nullable: false
    unit: minutes
    range: {min: 1, max: 1440}
    description: "Length of the period in minutes (60 = hourly, 15 = quarter-hourly)"
  - name: price_eur_mwh
    type: double
    unit: EUR/MWh
    range: {min: -500, max: 4000}
    description: "Price for that period"
completeness:
  time_column: datetime_utc
  period: day
  group_by: [price_type]
  resolution_column: resolution_minutes